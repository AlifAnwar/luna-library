name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate private package archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter docs exec playwright install --with-deps chromium firefox webkit

      - name: Run release gate
        run: pnpm release:check

      - name: Upload validated package archive
        uses: actions/upload-artifact@v7
        with:
          name: luna-private-archive-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
